# Demo gratuita y efímera: no sirve para conservar datos reales.
services:
  - type: web
    name: segunda-oportunidad-demo
    runtime: docker
    branch: feature/reciclaje-ronaldo
    plan: free
    autoDeployTrigger: "off"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Demo
      - key: PORT
        value: 8080
      - key: ConnectionStrings__DefaultConnection
        value: Data Source=/tmp/segunda-demo/app.db;Cache=Shared
      - key: DataProtection__KeyPath
        value: /tmp/segunda-demo/keys
      - key: BootstrapAdmin__Email
        sync: false
      - key: BootstrapAdmin__Password
        sync: false
# Tras iniciar sesión como BootstrapAdmin, ejecutar /Demo explícitamente.
# ML no usa Python ni un segundo servicio en runtime; su JSON va en la imagen.
